# Stack local: API + Prometheus + Grafana. O Prometheus também monitora a API publicada no Azure.
# Antes de subir: scripts/monitoring_setup.sh (gera o token e o alvo da nuvem).
services:
  api:
    build: .
    image: agrofacil-visao:local
    ports: ["127.0.0.1:8000:8000"]
    env_file: monitoring/secrets/api.env
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    secrets: [metrics_token]
    depends_on: [api]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agrofacil.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets: [grafana_admin]
    depends_on: [prometheus]
    restart: unless-stopped

secrets:
  metrics_token:
    file: monitoring/secrets/metrics_token
  grafana_admin:
    file: monitoring/secrets/grafana_admin

volumes:
  prometheus-data:
